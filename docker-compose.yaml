# Farmer stack: Redis, the distributor, and one container per farmer.
#
# Layout expected on the server (repos cloned side by side):
#   ~/farmer/               this repo, with config.yaml next to this file
#   ~/distributor/          with its own config.yaml
#
# Both config.yaml files are gitignored and hold credentials. They're mounted
# read-only and never baked into an image. Containers reach Redis by its service
# name on the "farm" network, so the server configs must use redis_host: "redis"
# (distributor config, each farmer's data_source and order_manager_params).
#
# Usage:
#   docker compose up -d --build              # Redis, distributor, all farmers
#   docker compose logs -f mnq_day_type
#   docker compose exec redis redis-cli SUBSCRIBE "ticks:CON.F.US.MNQ.Z26"
#   redis-cli -h <server-ip> PING             # from another machine on the LAN (port 6379)
#   docker compose down                       # SIGINT to each: farmers flatten, distributor unsubscribes
#
# This stack is for forward testing and logging: every farmer here should have its
# order manager disabled. To trade live, run that farmer on another machine against
# this Redis (see the redis service below).
#
# Only farmers with data_source kind "redis" belong here. A "projectx" data source
# opens its own SignalR connection, and ProjectX allows one at a time, so it would
# fight the distributor.

x-farmer: &farmer
  image: farmer
  build: .
  volumes:
    - ./config.yaml:/app/config.yaml:ro
  networks: [farm]
  depends_on:
    redis:
      condition: service_healthy
    distributor:
      condition: service_started
  stop_grace_period: 30s
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  redis:
    image: redis:7.4.2-alpine
    # Pub/sub only: nothing to persist
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [farm]
    # Published on the LAN so a farmer on another machine can use this stack's
    # distributor feed (ProjectX allows only one distributor). There's no password,
    # so this relies on the server being reachable only from the private network.
    # Docker's published ports bypass ufw, so a ufw rule won't restrict this.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  distributor:
    image: distributor
    build: ../distributor
    command: ["--config", "config.yaml", "--level", "info"]
    volumes:
      - ../distributor/config.yaml:/app/config.yaml:ro
    networks: [farm]
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  # --- Farmers (each must have a matching entry in config.yaml) ---
  mnq_day_type:
    <<: *farmer
    command: ["--name", "mnq_day_type", "--level", "info"]

  mnq_absorption_scanner:
    <<: *farmer
    command: ["--name", "mnq_absorption_scanner", "--level", "info"]

  cl_wick_reversal:
    <<: *farmer
    command: ["--name", "cl_wick_reversal", "--level", "info"]

  cl_absorption_scanner:
    <<: *farmer
    command: ["--name", "cl_absorption_scanner", "--level", "info"]

  mnq_noise_area:
    <<: *farmer
    command: ["--name", "mnq_noise_area", "--level", "info"]

  mes_vwap_mean_reversion_ladder:
    <<: *farmer
    command: ["--name", "mes_vwap_mean_reversion_ladder", "--level", "info"]

networks:
  farm:
